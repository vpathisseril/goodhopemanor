name: Validate Good Hope Manor site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        # The application lives in a subfolder of the repository.
        working-directory: goodhopemanor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run validate
      - name: Verify dependency policy
        run: npm ls --all --depth=0
